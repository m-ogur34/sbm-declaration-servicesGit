server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

spring:
  application:
    name: sbm-declaration-services
  profiles:
    active: dev

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        use_sql_comments: true
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jta:
    enabled: false
  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    tr.com.allianz.ysv.services: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
