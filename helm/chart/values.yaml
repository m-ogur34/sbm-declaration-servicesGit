# global: hem bu chart'in hem de springboot-deployment alt chart'inin okudugu
# ortak degerler (Helm'in yerlesik "global" mekanizmasi).
global:
  # Harbor/Nexus artifact adi ve ConfigMap/Secret adlarinin oneki.
  repoName: sbm-declaration-services
  bundleName: sbm-declaration-services
  # overrides: deploy aninda -f helm/values/<ortam>.yaml ile ezilebilen kacis
  # kapilari. Hepsi ~ (null) ise yukaridaki varsayilanlar gecerlidir.
  overrides:
    # bundleName: ConfigMap/Secret adlarini degistirmek icin (_helpers.tpl).
    bundleName: ~
    # esb.server: pod'a ESB_SERVER ortam degiskeni olarak gecer ve
    # common-configs/application.yml icindeki ${ESB_SERVER:...} ifadesini ezer.
    # Normalde bos birakilir; tum ortamlar esb.allianz.com.tr:12000 kullanir.
    # DNS cozulmeyen bir ortam olursa ornek: http://10.70.47.135:21011 (SC-UAT OSB)
    esb:
      server: ~
    chart:
      ingress:
        skipHostPrefix: false
springboot-deployment:
  enabled: true
  deployment:
    podLogger:
      enabled: true
      template:
        - image: harbor.allianz-tr.local/allianz-release/pod-logger:v2
          name: pod-logger
          resources:
            requests:
              cpu: '1m'
              memory: 12Mi
          volumeMounts:
            - mountPath: /tmp
              name: log-path
              readOnly: true
  app:
    configs:
      enabled: true
    contextPath: sbm-declaration-services
    image:
      repository:
        group: internal-release
        name: sbm-declaration-services
    probes:
      enabled: true
      template:
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /sbm-declaration-services/actuator/health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /sbm-declaration-services/actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /sbm-declaration-services/actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
    secretManager:
      vault:
        type: vault
  ingress:
    annotations:
      nginx.org/mergeable-ingress-type: minion
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    hosts:
      - alias: '0'
        prefix: 'int-'
        host: elementer.allianz.com.tr
        paths:
          - path: /sbm-declaration-services
            pathType: Prefix
