global:
  repoName: sbm-declaration-services
  bundleName: sbm-declaration-services
  overrides:
    bundleName: ~
    esb:
      server: ~
    chart:
      ingress:
        skipHostPrefix: false
springboot-deployment:
  enabled: true
  deployment:
    podLogger:
      enabled: true
      template:
        - image: harbor.allianz-tr.local/allianz-release/pod-logger:v5
          name: pod-logger
          resources:
            requests:
              cpu: '1m'
              memory: 12Mi
          volumeMounts:
            - mountPath: /tmp
              name: log-path
              readOnly: true
  app:
    contextPath: sbm-declaration-services
    image:
      repository:
        group: internal-release
        name: sbm-declaration-services
    secretManager:
      vault:
        type: vault
    probes:
      enabled: true
      template:
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /sbm-declaration-services/actuator/health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /sbm-declaration-services/actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 2
        startupProbe:
          failureThreshold: 3
          httpGet:
            path: /sbm-declaration-services/actuator/health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
  ingress:
    ingressClassName: "nginx"
    annotations:
      nginx.org/mergeable-ingress-type: minion
    hosts:
      - alias: '0'
        prefix: 'int-'
        host: elementer.allianz.com.tr
        paths:
          - path: /sbm-declaration-services
            pathType: Prefix
