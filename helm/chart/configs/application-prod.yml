spring:
  datasource:
    opus:
      driver-class-name: oracle.jdbc.OracleDriver
    cognos:
      driver-class-name: oracle.jdbc.OracleDriver
  management:
    endpoints:
      web:
        exposure:
          include: "*"
      loggers:
        enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  properties:
    hibernate:
      use_sql_comments: true
      format_sql: true
      type: trace
  application:
    name: sbm-declaration-services
  jta:
    enabled: false

logging:
  level:
    root: INFO
    com.allianz.common.collection: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    tr.com.allianz.ysv.services: INFO


token-management:
  base-url: https://int-auth.allianz.com.tr

