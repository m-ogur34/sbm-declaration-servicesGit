spring:
  datasource:
    hikari:
      connection-timeout: 50000
      maximum-pool-size: 25 #maximum pool size

token-management:
  base-url: https://int-auth.allianz.com.tr

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO
    org.springframework.web: INFO

# PROD'da API dokümantasyonu kapalı (PEN): /swagger-ui ve api-docs 404 döner.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
