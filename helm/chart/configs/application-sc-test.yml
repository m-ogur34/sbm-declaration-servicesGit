# Sadece bu ortama ozgu ayarlar. Ortak olan her sey
# common-configs/application.yml icindedir.
token-management:
  base-url: https://int-sc-test-auth.allianz.com.tr

logging:
  level:
    tr.com.allianz.ysv.services: DEBUG

# Sadece test ortamlarinda: log seviyesini calisirken degistirebilmek ve
# health detaylarini gorebilmek icin. PREP/PROD'da acik degil.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
    loggers:
      enabled: true
