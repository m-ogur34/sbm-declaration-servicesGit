server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO

spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: sbm-declaration-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

esb:
  ysv:
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

sbm:
  retry:
    max-attempts: 2          # only for SEC-00002 and 5xx
