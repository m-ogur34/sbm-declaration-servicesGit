server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO
    org.springframework.web: INFO

spring:
  application:
    name: sbm-declaration-services
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: sbm-declaration-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

esb:
  base-url: ${ESB_SERVER:http://esb.allianz.com.tr:12000}
  ysv:
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

token-management:
  path: /alz-token-management/api/v1/tokens/sbm-token-generate
  client-name: ${tokenManagementClientName}
  company-code: ${tokenManagementCompanyCode}
  connect-timeout: 30s
  read-timeout: 30s

sbm:
  company-code: ${sbmCompanyCode}
  retry:
    max-attempts: 2
