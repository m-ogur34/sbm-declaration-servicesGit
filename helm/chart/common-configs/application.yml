server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services

logging:
  level:
    root: INFO
    tr.com.allianz.ysv.services: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  file:
    max-size: 100MB
    max-history: 60

spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: sbm-declaration-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true


esb:
  base-url: ${ESB_SERVER:http://esb.allianz.com.tr:12000}
  ysv:
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

token-management:
  path: /alz-token-management/api/v1/tokens/sbm-token-generate
  client-name: ${tokenManagementClientName}
  user-name: ${tokenManagementUserName}
  company-code: ${tokenManagementCompanyCode}
  connect-timeout: 30s
  read-timeout: 30s

sbm:
  company-code: ${sbmCompanyCode}
  retry:
    max-attempts: 2
