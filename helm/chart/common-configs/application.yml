server:
  port: 8080
  servlet:
    context-path: /sbm-declaration-services


spring:
  application:
    name: sbm-declaration-services
  transaction:
    default-timeout: 50000
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 10
      idle-timeout: 10000 #maximum idle time for connection
      auto-commit: true #default auto-commit behavior
      connection-init-sql: ALTER SESSION SET NLS_LANGUAGE='TURKISH' NLS_DATE_FORMAT='DD/MM/YYYY' NLS_TERRITORY='TURKEY' NLS_CURRENCY='TL' NLS_ISO_CURRENCY='TURKEY' NLS_NUMERIC_CHARACTERS=',.' NLS_CALENDAR='GREGORIAN' NLS_DATE_LANGUAGE='TURKISH' NLS_SORT='TURKISH' NLS_TIME_FORMAT='HH24:MI:SSXFF' NLS_TIMESTAMP_FORMAT='DD/MM/RRRR HH24:MI:SSXFF' NLS_TIME_TZ_FORMAT='HH24:MI:SSXFF TZR' NLS_TIMESTAMP_TZ_FORMAT='DD/MM/RRRR HH24:MI:SSXFF TZR' NLS_DUAL_CURRENCY='TL' NLS_COMP='BINARY' NLS_LENGTH_SEMANTICS='BYTE' NLS_NCHAR_CONV_EXCP='FALSE'
  jpa:
    show-sql: false
    # İstek boyunca EntityManager açık tutulmaz; entity'lerde lazy ilişki yok, her iş kendi transaction'ında
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        use_sql_comments: true
        globally_quoted_identifiers: false
        format_sql: true
        type: error
        generate_statistics: false
        # Excel yüklemede satırlar 50'lik gruplar hâlinde tek seferde yazılır (satır başına ayrı INSERT yerine)
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
      jakarta:
        persistence:
          query:
            timeout: 60000

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /swagger-ui/api/api-docs
  swagger-ui:
    path: /swagger-ui
    doc-expansion: none
    display-request-duration: true
    deep-linking: true
    show-extensions: true
    default-model-expand-depth: 1
    default-models-expand-depth: 1
    operations-sorter: alpha
    tags-sorter: alpha

esb:
  base-url: ${ESB_SERVER:http://esb.allianz.com.tr:12000}
  ysv:
    beyanname-path: /sbmDeclarationServices
    sorgu-path: /sbmDeclarationServices
  connect-timeout: 10s
  read-timeout: 60s

token-management:
  path: /alz-token-management/api/v1/tokens/sbm-token-generate
  client-name: ${TOKEN_MANAGEMENT_CLIENT_NAME}
  company-code: ${TOKEN_MANAGEMENT_COMPANY_CODE}
  connect-timeout: 30s
  read-timeout: 30s

sbm:
  company-code: ${SBM_COMPANY_CODE}
  retry:
    max-attempts: 2
