global:
  overrides:
    esb:
      # TODO: SC-TEST OSB proxy host:port'u ESB ekibinden alinacak.
      # Bos birakilirsa default kullanilir: http://esb.allianz.com.tr:12000
      server: ~

springboot-deployment:
  gateway:
    migration:
      mode: istio
  app:
    env:
      java:
        args: -Xms3g -Xmx3g -XX:+FlightRecorder
      others:
        - name: COMMON_CONFIG
          value: application-config-common.yml
      springboot:
        profile: sc-test
      sysType: SC-TEST
    resources:
      limits:
        cpu: '2'
        memory: 3Gi
      requests:
        cpu: '0.5'
        memory: 3Gi
    secretManager:
      vault:
        secret: kv/data/TEST
        template: |
          {{ with secret "kv/data/TEST/data-source/opusAgencyDataSource" -}}
             export SPRING_DATASOURCE_USERNAME="{{ .Data.data.username_allzwebpol }}"
             export SPRING_DATASOURCE_PASSWORD="{{ .Data.data.password_allzwebpol }}"
             export SPRING_DATASOURCE_URL="{{ .Data.data.URL_OPUSTEST_FINANS }}"
          {{- end }}
          {{ with secret "kv/data/TEST/apps/sbm-declaration-services" -}}
            export SWAGGER_API_KEY="{{ .Data.data.swaggerApiKey }}"
            export TOKEN_MANAGEMENT_CLIENT_NAME="{{ .Data.data.tokenManagementClientName }}"
            export SBM_COMPANY_CODE="{{ .Data.data.tokenManagementCompanyCode }}"
            export TOKEN_MANAGEMENT_COMPANY_CODE="{{ .Data.data.tokenManagementCompanyCode }}"
            export TOKEN_MANAGEMENT_USER_NAME="{{ .Data.data.tokenManagementUserName }}"
          {{- end }}
  autoscale:
    minReplicas: 1
    maxReplicas: 1
